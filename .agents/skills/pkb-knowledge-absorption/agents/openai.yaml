interface:
  display_name: "PKB Knowledge Absorption"
  short_description: "Absorb durable knowledge into the local PKB and optionally sync its read-only GitHub mirror"
  default_prompt: "Use $pkb-knowledge-absorption to independently review a Chat-window or other source package, separate PKB guidance from external-project Current evidence, route and deduplicate detailed personal context and verified reusable pitfalls, then refresh only affected Memory projections, validate privacy and local-repository authority, commit approved PKB-only changes without requiring Project Closeout, and synchronize the validated commit to the GitHub read-only mirror only when explicitly authorized."
